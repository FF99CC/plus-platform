# Local container overlay for the upstream dev profile.
spring.datasource.dynamic.datasource.master.url=jdbc:mysql://db:3306/plus_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia%2FSingapore&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
spring.datasource.dynamic.datasource.master.username=plus_app
spring.datasource.dynamic.datasource.master.password=${DB_PASSWORD}
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
sa-token.jwt-secret-key=${JWT_SECRET}
captcha.enable=${CAPTCHA_ENABLED:true}
api-decrypt.enabled=false
api-decrypt.publicKey=
api-decrypt.privateKey=
spring.ai.mcp.server.enabled=false
spring.ai.mcp.client.enabled=false
spring.boot.admin.client.enabled=false
snail-job.enabled=false
snail-ai.enabled=false
snail-ai.open-api.enabled=false
mail.enabled=false
warm-flow.enabled=true
warm-flow.ui=true
message.enabled=true
message.transport=sse
mybatis-plus.sql-log.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
